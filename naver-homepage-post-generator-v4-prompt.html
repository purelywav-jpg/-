  function generatePrompt() {
    const themeId = document.getElementById('themeSelect').value;
    const targetInfo = document.getElementById('targetInfo').value;

    if (!themeId) {
      alert('주제를 선택해주세요.');
      return;
    }

    let prompt = prompts[themeId];

    if (targetInfo) {
      prompt = prompt.replace(/【지시사항】\n다음을 중심으로/, `【지시사항】\n다음의 "${targetInfo}"를 중심으로`);
    }

    // 해시태그 추가
    const themeHashtags = hashtags[themeId];
    if (themeHashtags) {
      prompt += '\n\n【추천 해시태그 10개】\n' + themeHashtags.join(' ');
    }

    window.lastPrompt = prompt;

    const output = document.getElementById('outputContent');
    output.innerHTML = `
      <div class="prompt-text">${prompt}</div>

      <div class="action-notice">
        <strong>💡 사용 방법</strong><br>
        이 프롬프트를 복사한 후 다음과 같이 사용할 수 있습니다:<br>
        • ChatGPT, Claude 등 AI에게 복사해서 전달<br>
        • 또는 직접 원고 작성할 때 가이드라인으로 사용<br>
        • 모든 규칙을 따르면 네이버 홈판 최적화 원고 완성
      </div>

      <button class="copy-btn" onclick="copyPrompt()">📋 전체 복사</button>
      <button class="download-btn" onclick="downloadPrompt()">💾 텍스트 다운로드</button>
      <button class="edit-btn" onclick="toggleEdit()">✏️ 수정</button>
    `;
  }

  function copyPrompt() {
    if (window.lastPrompt) {
      navigator.clipboard.writeText(window.lastPrompt).then(() => {
        alert('프롬프트가 복사되었습니다. 이제 AI에게 붙여넣기할 수 있습니다.');
      });
    }
  }

  function downloadPrompt() {
    if (window.lastPrompt) {
      const element = document.createElement('a');
      element.setAttribute('href', 'data:text/plain;charset=utf-8,' + encodeURIComponent(window.lastPrompt));
      element.setAttribute('download', 'naver-blog-prompt.txt');
      element.style.display = 'none';
      document.body.appendChild(element);
      element.click();
      document.body.removeChild(element);
    }
  }

  function toggleEdit() {
    const output = document.getElementById('outputContent');
    const textarea = output.querySelector('.textarea-edit');

    if (textarea) {
      window.lastPrompt = textarea.value;
      generateDisplayView();
    } else {
      output.innerHTML = `
        <textarea class="textarea-edit">${window.lastPrompt}</textarea>
        <button class="copy-btn" onclick="copyPrompt()">📋 복사</button>
        <button class="download-btn" onclick="downloadPrompt()">💾 다운</button>
        <button class="edit-btn" onclick="toggleEdit()">✏️ 완료</button>
      `;
    }
  }

  function generateDisplayView() {
    const output = document.getElementById('outputContent');
    output.innerHTML = `
      <div class="prompt-text">${window.lastPrompt}</div>

      <div class="action-notice">
        <strong>💡 사용 방법</strong><br>

      <button class="edit-btn" onclick="toggleEdit()">✏️ 수정</button>
    `;
  }
