위의 규칙과 체크리스트를 모두 따라 작성된 원고가 최종 결과입니다.`
  };

  const hashtags = {
    person: ['#화제인물', '#연예인', '#인물', '#변화', '#근황', '#선택', '#이슈', '#현재', '#뉴스', '#이야기'],
    social: ['#사회현상', '#화제', '#최근이슈', '#변화', '#트렌드', '#의견', '#일상', '#뉴스', '#공감', '#현실'],
    trend: ['#트렌드', '#패션', '#미용', '#라이프스타일', '#변화', '#선택', '#비교', '#요즘', '#인기', '#스타일'],
    relation: ['#인간관계', '#결혼', '#양육', '#갈등', '#선택', '#의견', '#공감', '#현실', '#이야기', '#경험'],

    story: ['#경험담', '#일상', '#순간', '#감정', '#공감', '#이야기', '#깨달음', '#변화', '#의미', '#기억'],
    ai: ['#AI활용', '#ChatGPT', '#인공지능', '#AI도구', '#생산성', '#자동화', '#AI학습', '#기술활용', '#업무효율', '#AI팁']
  };

  function generatePrompt() {
    const themeId = document.getElementById('themeSelect').value;

    if (!themeId) {
      alert('주제를 선택해주세요.');
      return;
    }

    let prompt = prompts[themeId];

    // 해시태그 추가
    const themeHashtags = hashtags[themeId];
    if (themeHashtags) {
      prompt += '\n\n【추천 해시태그 10개】\n' + themeHashtags.join(' ');
    }

    window.lastPrompt = prompt;

    const output = document.getElementById('outputContent');
    output.innerHTML = `
      <div class="action-buttons-group">
        <button class="copy-btn" onclick="copyPrompt()">📋 전체 복사</button>
        <button class="download-btn" onclick="downloadPrompt()">💾 텍스트 다운로드</button>
        <button class="edit-btn" onclick="toggleEdit()">✏️ 수정</button>
      </div>

      <div class="prompt-text">${prompt}</div>

      <div class="action-notice">
        <strong>💡 사용 방법</strong><br>
        이 프롬프트를 복사한 후 다음과 같이 사용할 수 있습니다:<br>
        • ChatGPT, Claude 등 AI에게 복사해서 전달<br>
        • 또는 직접 원고 작성할 때 가이드라인으로 사용<br>
        • 모든 규칙을 따르면 네이버 홈판 최적화 원고 완성
      </div>
    `;
  }

  async function copyPrompt() {
    if (window.lastPrompt) {
      try {
        // 모던 Clipboard API 사용
        await navigator.clipboard.writeText(window.lastPrompt);
        alert('✅ 프롬프트가 복사되었습니다!\n\nAI에 붙여넣기하세요.');
      } catch (err) {
        // Clipboard API 실패 시 execCommand로 fallback
        const output = document.getElementById('outputContent');
        const promptDiv = output.querySelector('.prompt-text');

        if (promptDiv) {
          const range = document.createRange();
          range.selectNodeContents(promptDiv);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);

          try {
            const success = document.execCommand('copy');
            if (success) {
              alert('✅ 프롬프트가 복사되었습니다!\n\nAI에 붙여넣기하세요.');
            } else {
              showCopyHelper();
            }
          } catch (e) {
            showCopyHelper();
          }

          sel.removeAllRanges();
        }
      }
    }
  }

  function showCopyHelper() {
    const output = document.getElementById('outputContent');
    output.innerHTML = `
      <div class="action-buttons-group">
        <button class="copy-btn" onclick="copyPrompt()">📋 전체 복사</button>
        <button class="download-btn" onclick="downloadPrompt()">💾 텍스트 다운로드</button>
        <button class="edit-btn" onclick="toggleEdit()">✏️ 수정</button>
      </div>

      <div style="background: #1a3a1a; border-left: 3px solid #4ade80; padding: 1rem; margin-bottom: 1.5rem; border-radius: 4px;">
        <strong style="color: #4ade80;">📋 수동 복사 방법</strong><br>
        <span style="color: #aaa; font-size: 0.9rem;">아래 프롬프트를 드래그해서 선택한 후 Ctrl+C (또는 Cmd+C)로 복사하세요.</span>
      </div>

      <div class="prompt-text" style="cursor: text; user-select: text; padding: 1rem; background: #0a0a0a; border: 1px solid #333; border-radius: 6px;">${window.lastPrompt}</div>

      <div class="action-notice">
        <strong>💡 사용 방법</strong><br>
        이 프롬프트를 복사한 후 AI에게 전달하거나 직접 참고하세요.
      </div>

      <div class="action-buttons-group">
        <button class="copy-btn" onclick="copyPrompt()">📋 복사 재시도</button>
        <button class="download-btn" onclick="downloadPrompt()">💾 다운로드</button>
        <button class="edit-btn" onclick="toggleEdit()">✏️ 수정</button>
      </div>
    `;
  }

  async function downloadPrompt() {
    if (window.lastPrompt) {
      try {
        // Artifact downloads API 사용 (Claude 환경)
        if (window.claude && window.claude.downloads && window.claude.downloads.save) {
          const blob = new Blob([window.lastPrompt], { type: 'text/plain;charset=utf-8' });
          await window.claude.downloads.save(blob, 'naver-blog-prompt.txt');
          alert('✅ 파일이 다운로드되었습니다!');
          return;
        }
      } catch (err) {
        console.log('Claude downloads API 사용 불가, fallback 사용');
      }

      // Fallback: 전통적인 data URI 방식
      try {
        const element = document.createElement('a');
        element.setAttribute('href', 'data:text/plain;charset=utf-8,' + encodeURIComponent(window.lastPrompt));
        element.setAttribute('download', 'naver-blog-prompt.txt');
        element.style.display = 'none';
        document.body.appendChild(element);
        element.click();
        document.body.removeChild(element);
        alert('✅ 파일이 다운로드되었습니다!');
      } catch (err) {
        alert('⚠️ 다운로드에 실패했습니다. 복사 기능을 사용해주세요.');
      }
    }
  }

  function toggleEdit() {
    const output = document.getElementById('outputContent');
    const textarea = output.querySelector('.textarea-edit');

    if (textarea) {
      window.lastPrompt = textarea.value;
      generateDisplayView();
    } else {
      output.innerHTML = `
        <div style="display: flex; gap: 0.5rem; margin-bottom: 1.5rem; flex-wrap: wrap;">
          <button class="copy-btn" onclick="copyPrompt()">📋 복사</button>
          <button class="download-btn" onclick="downloadPrompt()">💾 다운</button>
          <button class="edit-btn" onclick="toggleEdit()">✏️ 완료</button>
        </div>
        <textarea class="textarea-edit">${window.lastPrompt}</textarea>
      `;
    }
  }

  function generateDisplayView() {
    const output = document.getElementById('outputContent');
    output.innerHTML = `
      <div class="action-buttons-group">
        <button class="copy-btn" onclick="copyPrompt()">📋 전체 복사</button>
        <button class="download-btn" onclick="downloadPrompt()">💾 텍스트 다운로드</button>
        <button class="edit-btn" onclick="toggleEdit()">✏️ 수정</button>
      </div>

      <div class="prompt-text">${window.lastPrompt}</div>

      <div class="action-notice">
        <strong>💡 사용 방법</strong><br>
        이 프롬프트를 복사한 후 AI에게 전달하거나 직접 참고하세요.
      </div>
    `;
  }

  function resetForm() {
    document.getElementById('themeSelect').value = '';
    document.getElementById('outputContent').innerHTML = `
      <p class="initial-message">
        주제를 선택하고 "프롬프트 생성" 버튼을 누르면<br>
        원고 작성용 프롬프트가 여기에 나타납니다.<br><br>
        <strong>프롬프트 사용 방법:</strong><br>
        • 복사 후 ChatGPT, Claude 등 AI에게 전달<br>
        • 또는 직접 원고 작성 시 가이드로 사용
      </p>
    `;
    window.lastPrompt = null;
  }
</script>
