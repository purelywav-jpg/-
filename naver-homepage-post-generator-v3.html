<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>홈판 원고 자판기 v3 | 실사 기반</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #000;
      color: #fff;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 2rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid #333;
    }

    .header h1 {
      font-size: 2.2rem;
      font-weight: 800;
      margin: 0 0 0.3rem 0;
      color: #fff;
    }

    .header h1 strong {
      color: #D946EF;
    }

    .header p {
      color: #999;
      margin: 0.5rem 0;
      font-size: 0.95rem;
    }

    .control-panel {
      background: #111;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 1.5rem;
      margin-bottom: 2rem;
    }

    .control-group {
      margin-bottom: 1rem;
    }

    .control-group label {
      display: block;
      margin-bottom: 0.4rem;
      font-weight: 600;
      color: #D946EF;
      font-size: 0.85rem;
    }

    .control-group select,
    .control-group input {
      width: 100%;
      padding: 0.7rem;
      background: #1a1a1a;
      border: 1px solid #333;
      color: #fff;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.9rem;
    }

    .control-group select:focus,
    .control-group input:focus {
      outline: none;
      border-color: #D946EF;
    }

    .button-group {
      display: flex;
      gap: 0.8rem;
      margin-top: 1.5rem;
    }

    .btn {
      flex: 1;
      padding: 1rem;
      border: none;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.3s;
    }

    .btn-primary {
      background: #D946EF;
      color: #fff;
    }

    .btn-primary:hover {
      background: #c936de;
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(217, 70, 239, 0.3);
    }

    .btn-secondary {
      background: #222;
      color: #D946EF;
      border: 1px solid #D946EF;
    }

    .btn-secondary:hover {
      background: rgba(217, 70, 239, 0.1);
    }

    .output-section {
      margin-top: 2rem;
    }

    .output-box {
      background: #111;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 2rem;
      min-height: 350px;
    }

    .output-title {
      color: #D946EF;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid #333;
    }

    .post-title {
      font-size: 1.5rem;
      font-weight: 800;
      line-height: 1.4;
      margin: 0 0 1.5rem 0;
      color: #fff;
    }

    .post-content {
      line-height: 1.8;
      color: #ccc;
      white-space: pre-wrap;
      word-wrap: break-word;
      font-size: 0.95rem;
    }

    .edit-notice {
      background: rgba(217, 70, 239, 0.05);
      border-left: 3px solid #D946EF;
      padding: 1rem;
      margin: 1.5rem 0 0 0;
      border-radius: 4px;
      font-size: 0.85rem;
      color: #aaa;
    }

    .copy-btn,
    .download-btn,
    .edit-btn {
      background: #222;
      color: #D946EF;
      border: 1px solid #D946EF;
      padding: 0.7rem 1.2rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      margin: 1rem 0.3rem 0 0;
      font-size: 0.85rem;
      transition: all 0.3s;
    }

    .copy-btn:hover,
    .download-btn:hover,
    .edit-btn:hover {
      background: rgba(217, 70, 239, 0.1);
    }

    .textarea-edit {
      width: 100%;
      min-height: 300px;
      background: #1a1a1a;
      border: 1px solid #333;
      color: #ccc;
      padding: 1rem;
      border-radius: 6px;
      font-family: 'Gowun Batang', serif;
      font-size: 0.95rem;
      line-height: 1.8;
      resize: vertical;
    }

    .textarea-edit:focus {
      outline: none;
      border-color: #D946EF;
    }

    .hidden { display: none !important; }

    @media (max-width: 768px) {
      .button-group { flex-direction: column; }
      .header h1 { font-size: 1.8rem; }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>홈판 <strong>원고</strong> 자판기 v3</h1>
    <p>주제 선택만 → 실제 사실 기반 원고</p>
    <p style="color: #666; font-size: 0.8rem;">직접 수정하면서 사용하세요</p>
  </div>

  <div class="control-panel">
    <div class="control-group">
      <label>📌 주제 선택</label>
      <select id="themeSelect">
        <option value="">-- 선택하세요 --</option>
        <option value="morning">일상 루틴 (아침·저녁)</option>
        <option value="organization">생활 정보 (정리·수납)</option>
        <option value="habit">습관 변화 (개선)</option>
        <option value="travel">지역 정보 (여행·투어)</option>
        <option value="reading">취미 (책·영화·음악)</option>
        <option value="worklife">일상 팁 (일·쉼)</option>
        <option value="growth">자기 개발</option>
        <option value="joy">감정 공유 (일상의 순간)</option>
      </select>
    </div>

    <div class="control-group">
      <label>🏷️ 지역·대상 (선택)</label>
      <input type="text" id="targetInfo" placeholder="예: 강남, 직장인, 초보자">
    </div>

    <div class="button-group">
      <button class="btn btn-primary" onclick="generatePost()">원고 생성</button>
      <button class="btn btn-secondary" onclick="resetForm()">초기화</button>
    </div>
  </div>

  <div class="output-section">
    <div class="output-box">
      <div class="output-title">생성된 원고</div>
      <div id="outputContent">
        <p style="color: #666; text-align: center; padding: 2rem;">
          주제를 선택하고 "원고 생성" 버튼을 누르면<br>
          수정 가능한 원고가 여기에 나타납니다.
        </p>
      </div>
    </div>
  </div>
</div>

<script>
  const themes = [
    {
      id: 'morning',
      name: '일상 루틴 (아침·저녁)',
      templates: [
        { title: '아침 {time}분에 일어나면 하루가 달라진다', content: '아침 일찍 일어나는 것부터 시작했다.\n\n처음 1주일은 힘들었는데, 2주차부터 몸이 적응했다.\n가장 큰 변화는 저녁에 여유가 생긴다는 것.\n{info}기준으로 {time}분 정도 단축됐다.' },
        { title: '저녁 루틴 3가지 바꿨더니', content: '저녁 루틴을 고쳐보기로 했다.\n\n첫째, 밤 10시 이후 휴대폰 금지.\n둘째, 스트레칭 10분.\n셋째, 명상 또는 독서.\n\n3주 해보니 새벽에 일어나는 일이 줄었다.' },
        { title: '하루를 시작하는 습관', content: '루틴이 중요한 이유는 반복이 쉬워지기 때문이다.\n\n처음 {info}에서 시작했을 때는 의식적으로 해야 했다.\n지금은 무의식적으로 반복된다.\n이것이 습관의 힘이다.' }
      ]
    },
    {
      id: 'organization',
      name: '생활 정보 (정리·수납)',
      templates: [
        { title: '정리정돈 이렇게 하니 2배 쉽다', content: '정리를 어려워하는 이유는 방법을 모르기 때문이다.\n\n가장 중요한 건 카테고리 분류다.\n같은 종류끼리 묶으면 자동으로 정리된다.\n{info}에서 시작하면 가장 효과가 빠르다.' },
        { title: '50평 아파트 수납 팁 5가지', content: '공간을 효율적으로 쓰려면 높이를 활용해야 한다.\n\n벽을 정장했을 때 바닥 공간이 20% 늘었다.\n특히 침실과 거실에서 효과가 크다.\n실제로 해보면 놀랄 정도로 달라진다.' },
        { title: '정리해서 알게 된 것들', content: '정리하다 보니 불필요한 것들이 얼마나 많은지 봤다.\n\n버린 물건이 무려 200개가 넘었다.\n남은 물건들의 가치가 더 높아진 기분이다.\n이제 새로운 것을 들일 때 신중해진다.' }
      ]
    },
    {
      id: 'habit',
      name: '습관 변화 (개선)',
      templates: [
        { title: '{time}주 습관 도전 결과', content: '습관을 만들려면 무엇이 필요할까?\n\n결론은 작게 시작하는 것이다.\n{info}에서 {time}주 도전해봤다.\n처음 1주일이 가장 힘들다. 그 이후는 자동이다.' },
        { title: '한 가지 습관을 바꿨더니', content: '하나를 바꾸면 다른 하나도 따라온다.\n\n아침 운동을 시작했는데 밥도 달라졌다.\n늦은 밤 휴대폰도 줄었다.\n습관은 연쇄다.' },
        { title: '실패하고 배운 것', content: '처음에는 너무 큰 목표로 시작했다.\n\n한 달 만에 포기했다.\n그 다음에는 더 작게 시작했다.\n이번엔 3개월을 버틸 수 있었다.' }
      ]
    },
    {
      id: 'travel',
      name: '지역 정보 (여행·투어)',
      templates: [
        { title: '{area} 숨은 명소 {num}곳', content: '{area}에 가면 유명한 곳만 간다는 생각은 이제 그만.\n\n현지인들만 아는 곳이 {num}곳 있다.\n가는 방법은 간단하고, 사람도 적다.\n{info}에 물어보면 더 잘 알려준다.' },
        { title: '{area} 여행 가서 먹은 것들', content: '여행의 절반은 먹는 것이다.\n\n{area}에서 유명한 음식은 다 먹어봤다.\n그 중에서 인상적인 것 {num}가지.\n가격도 생각보다 착했다.' },
        { title: '{area} 처음 가는 사람 필수 팁', content: '처음 {area}에 갔을 때 실수가 많았다.\n\n지금 알려주는 것 {num}가지만 기억하면 편하다.\n대중교통 카드, 환전, 거리 감각.\n이 3가지가 기본이다.' }
      ]
    },
    {
      id: 'reading',
      name: '취미 (책·영화·음악)',
      templates: [
        { title: '올해 읽은 책 중 최고 {num}권', content: '올해는 책을 {num}권 읽었다.\n\n그 중에서 인상 깊은 책 {num}권.\n각각 다른 장르인데 모두 좋았다.\n한 권씩 골라서 읽어보는 걸 추천한다.' },
        { title: '영화 본 뒤 하는 생각', content: '영화를 보고 나면 항상 생각이 든다.\n\n{info}에서는 어떻게 생각했을까?\n같은 장면도 사람마다 다르게 본다.\n그게 영화의 매력이다.' },
        { title: '{genre} 음악 플레이리스트', content: '{genre} 음악을 자주 듣는다.\n\n최근에 발견한 아티스트가 있다.\n{info} 분위기일 때 딱 맞다.\n플레이리스트에 넣고 자주 들어본다.' }
      ]
    },
    {
      id: 'worklife',
      name: '일상 팁 (일·쉼)',
      templates: [
        { title: '일과 쉼의 균형 찾기', content: '직장 다니면서 가장 중요한 건 균형이다.\n\n처음에는 다 해야 한다고 생각했다.\n그럼 번아웃된다.\n{info}를 중심으로 우선순위를 정했다.' },
        { title: '출퇴근 시간 활용법', content: '하루 중 출퇴근 시간이 2시간이다.\n\n이 시간을 버리기 아까워 변화를 줬다.\n오디오북, 팟캐스트, 문제집.\n같은 시간인데 훨씬 알찬 느낌이다.' },
        { title: '스트레스 푸는 방법 {num}가지', content: '업무 스트레스는 피할 수 없다.\n\n그래서 푸는 방법을 찾았다.\n{num}가지는 빠르고, {num}가지는 깊다.\n상황에 따라 선택한다.' }
      ]
    },
    {
      id: 'growth',
      name: '자기 개발',
      templates: [
        { title: '{skill} 배우면서 느낀 점', content: '{skill}을 배우기로 결심했다.\n\n가장 어려운 건 처음 시작이었다.\n{info}를 거쳐서 지금은 {level}(으)로 나아갔다.\n작은 진전이 모이면 큰 변화가 된다.' },
        { title: '년 공부 후 달라진 것', content: '지난 1년간 공부만 했다는 건 아니다.\n\n작은 실습을 계속했다.\n그 결과 {num}가지가 바뀌었다.\n무엇보다 자신감이 생겼다.' },
        { title: '배움의 방식을 바꿨다', content: '처음에는 방식이 틀렸다.\n\n책만 읽다가 영상으로 바꿨다.\n그 다음엔 실제로 해봤다.\n배우는 방식이 곧 효율이다.' }
      ]
    },
    {
      id: 'joy',
      name: '감정 공유 (일상의 순간)',
      templates: [
        { title: '오늘 있었던 작은 행복', content: '오늘 아침 날씨가 좋았다.\n\n창밖으로 햇빛이 들어왔다.\n그것만으로 기분이 좋아졌다.\n큰 일도 중요하지만 작은 것도 중요하다.' },
        { title: '누군가에게 고마웠던 일', content: '최근에 누군가 도와줬다.\n\n특별한 이유는 아니었다.\n당연하다는 듯이 옆에 있어줬다.\n고마움이 고마움을 만든다.' },
        { title: '일상에서 발견한 것들', content: '매일 같은 길을 다닌다.\n\n그런데 오늘 처음 본 가게가 있었다.\n얼마나 오래 있었는지 궁금했다.\n늘 새로운 것은 주변에 있다.' }
      ]
    }
  ];

  function generatePost() {
    const themeId = document.getElementById('themeSelect').value;
    const targetInfo = document.getElementById('targetInfo').value || '시도해봤을 때';

    if (!themeId) {
      alert('주제를 선택해주세요.');
      return;
    }

    const theme = themes.find(t => t.id === themeId);
    const template = theme.templates[Math.floor(Math.random() * theme.templates.length)];

    let title = template.title
      .replace('{time}', Math.floor(Math.random() * 10) + 1)
      .replace('{num}', Math.floor(Math.random() * 5) + 2)
      .replace('{area}', '지역')
      .replace('{genre}', '장르')
      .replace('{skill}', '스킬')
      .replace('{level}', '초중급');

    let content = template.content
      .replace(/\{info\}/g, targetInfo)
      .replace(/\{time\}/g, Math.floor(Math.random() * 4) + 1)
      .replace(/\{num\}/g, Math.floor(Math.random() * 5) + 2)
      .replace(/\{area\}/g, '지역')
      .replace(/\{genre\}/g, '장르')
      .replace(/\{skill\}/g, '스킬')
      .replace(/\{level\}/g, '초중급');

    window.lastPost = `${title}\n\n${content}`;

    const output = document.getElementById('outputContent');
    output.innerHTML = `
      <div class="post-title">${title}</div>
      <div class="post-content">${window.lastPost}</div>
      <div class="edit-notice">
        <strong>✏️ 직접 수정하면서 사용하세요</strong><br>
        이 원고는 템플릿입니다. 실제 경험과 사실을 반영해서 수정하세요.
      </div>
      <button class="copy-btn" onclick="copyToClipboard()">📋 복사</button>
      <button class="download-btn" onclick="downloadPost('${title.substring(0, 20)}')">💾 다운</button>
      <button class="edit-btn" onclick="toggleEdit()">✏️ 수정</button>
    `;
  }

  function toggleEdit() {
    const output = document.getElementById('outputContent');
    const textarea = output.querySelector('.textarea-edit');

    if (textarea) {
      window.lastPost = textarea.value;
      const lines = window.lastPost.split('\n');
      const title = lines[0];
      const content = lines.slice(2).join('\n');
      output.innerHTML = `
        <div class="post-title">${title}</div>
        <div class="post-content">${content}</div>
        <div class="edit-notice">
          <strong>✏️ 직접 수정하면서 사용하세요</strong><br>
          이 원고는 템플릿입니다. 실제 경험과 사실을 반영해서 수정하세요.
        </div>
        <button class="copy-btn" onclick="copyToClipboard()">📋 복사</button>
        <button class="download-btn" onclick="downloadPost('${title.substring(0, 20)}')">💾 다운</button>
        <button class="edit-btn" onclick="toggleEdit()">✏️ 수정</button>
      `;
    } else {
      output.innerHTML = `
        <textarea class="textarea-edit">${window.lastPost}</textarea>
        <button class="copy-btn" onclick="copyToClipboard()">📋 복사</button>
        <button class="download-btn" onclick="downloadPost('post')">💾 다운</button>
        <button class="edit-btn" onclick="toggleEdit()">✏️ 완료</button>
      `;
    }
  }

  function copyToClipboard() {
    if (window.lastPost) {
      navigator.clipboard.writeText(window.lastPost).then(() => {
        alert('복사되었습니다.');
      });
    }
  }

  function downloadPost(filename) {
    if (window.lastPost) {
      const element = document.createElement('a');
      element.setAttribute('href', 'data:text/plain;charset=utf-8,' + encodeURIComponent(window.lastPost));
      element.setAttribute('download', `${filename}.txt`);
      element.style.display = 'none';
      document.body.appendChild(element);
      element.click();
      document.body.removeChild(element);
    }
  }

  function resetForm() {
    document.getElementById('themeSelect').value = '';
    document.getElementById('targetInfo').value = '';
