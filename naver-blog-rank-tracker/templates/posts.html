{% extends "base.html" %}
{% block title %}포스팅 관리{% endblock %}
{% block content %}
<div class="dash-head">
  <h1>포스팅 관리</h1>
  <a class="btn-primary" href="{{ url_for('post_new') }}">+ 포스팅 추가</a>
</div>

{% for p in posts %}
<div class="post-card">
  <div class="post-card-head">
    <a href="{{ url_for('post_detail', post_id=p.id) }}"><strong>{{ p.title }}</strong></a>
    <div class="post-card-actions">
      <a href="{{ url_for('post_edit', post_id=p.id) }}">수정</a>
      <form method="post" action="{{ url_for('post_delete', post_id=p.id) }}"
            onsubmit="return confirm('삭제하시겠습니까? (과거 순위 기록은 유지됩니다)');">
        <button type="submit" class="link-btn">삭제</button>
      </form>
    </div>
  </div>
  <div class="post-url">{{ p.url }}</div>
  <div class="keyword-tags">
    {% for k in p.keywords %}<span class="tag">{{ k.keyword }}</span>{% endfor %}
  </div>
</div>
{% else %}
<p class="empty">등록된 포스팅이 없습니다.</p>
{% endfor %}
{% endblock %}
