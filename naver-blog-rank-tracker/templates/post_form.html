{% extends "base.html" %}
{% block title %}{{ "포스팅 수정" if post else "포스팅 추가" }}{% endblock %}
{% block content %}
<h1>{{ "포스팅 수정" if post else "포스팅 추가" }}</h1>
<form method="post" class="form">
  <label>포스팅 제목
    <input type="text" name="title" required value="{{ post.title if post else '' }}">
  </label>
  <label>포스팅 URL
    <input type="text" name="url" required value="{{ post.url if post else '' }}">
  </label>
  {% if not post %}
  <label>추적 키워드 (한 줄에 하나씩)
    <textarea name="keywords" rows="5" required placeholder="성복역 테라피&#10;용인 수지 피부관리"></textarea>
  </label>
  {% endif %}
  <button type="submit" class="btn-primary">저장</button>
</form>
{% endblock %}
