<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}네이버 블로그 순위추적{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar">
  <a class="brand" href="{{ url_for('dashboard') }}">네이버 블로그 순위추적</a>
  <nav>
    <a href="{{ url_for('dashboard') }}">대시보드</a>
    <a href="{{ url_for('posts_list') }}">포스팅 관리</a>
    <a href="{{ url_for('monthly') }}">월별 조회</a>
  </nav>
</header>
<main class="container">
  <p class="api-note">※ 모든 순위는 <strong>네이버 블로그 검색 API 기준 순위</strong>이며, 실제 네이버 통합검색 노출 순위와 다를 수 있습니다.</p>
  {% block content %}{% endblock %}
</main>
</body>
</html>
