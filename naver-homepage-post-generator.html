<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>홈판용 원고자판기 | 청정</title>
<meta name="description" content="한 번의 클릭으로 홈판 최적화 원고 완성">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cellipse cx='14' cy='17' rx='10' ry='8' transform='rotate(-18 14 17)' fill='%239B7FE0'/%3E%3Cellipse cx='34' cy='17' rx='10' ry='8' transform='rotate(18 34 17)' fill='%239B7FE0'/%3E%3Cellipse cx='24' cy='24' rx='1.8' ry='13' fill='%232B2438'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #000;
    margin: 0;
    padding: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .generator-container {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 2rem;
    text-align: center;
  }

  .gen-header {
    margin-bottom: 3rem;
    color: #fff;
  }

  .gen-header h1 {
    font-size: 3.5rem;
    font-weight: 800;
    line-height: 1.2;
    margin: 0 0 1rem 0;
    color: #fff;
  }

  .gen-header h1 strong {
    color: #D946EF;
  }

  .gen-header p {
    font-size: 1.2rem;
    color: #999;
    margin: 0;
    line-height: 1.6;
  }

  .button-group {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    margin-top: 3rem;
  }

  .generate-btn {
    padding: 1.5rem 3rem;
    background: #D946EF;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 1.3rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s;
    letter-spacing: 0.5px;
  }

  .generate-btn:hover {
    background: #c936de;
    transform: translateY(-2px);
    box-shadow: 0 10px 30px rgba(217, 70, 239, 0.3);
  }

  .generate-btn:active {
    transform: translateY(0);
  }

  .output-section {
    margin-top: 3rem;
  }

  .output-content {
    background: #1a1a1a;
    color: #fff;
    border-radius: 12px;
    padding: 2.5rem;
    min-height: 300px;
    max-height: 700px;
    overflow-y: auto;
    line-height: 2;
    font-size: 1rem;
    text-align: left;
    font-family: 'Gowun Batang', serif;
    display: none;
  }

  .output-content.active {
    display: block;
    animation: fadeIn 0.5s ease-in;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .output-content h1 {
    font-size: 1.8rem;
    font-weight: 700;
    margin: 0 0 2rem 0;
    color: #D946EF;
  }

  .output-content h2 {
    font-size: 1.4rem;
    margin: 2rem 0 1rem 0;
    color: #D946EF;
    font-weight: 700;
  }

  .output-content p {
    margin-bottom: 1.5rem;
    color: #e0e0e0;
  }

  .button-actions {
    display: flex;
    gap: 1rem;
    margin-top: 2rem;
    justify-content: center;
  }

  .copy-btn, .download-btn {
    padding: 1rem 2rem;
    border: none;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    font-size: 1rem;
  }

  .copy-btn {
    background: #D946EF;
    color: #fff;
  }

  .copy-btn:hover {
    background: #c936de;
  }

  .download-btn {
    background: #333;
    color: #fff;
    border: 1px solid #555;
  }

  .download-btn:hover {
    background: #444;
  }

  .new-post-btn {
    background: #333;
    color: #fff;
    border: 1px solid #555;
    padding: 1rem 2rem;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 1rem;
    transition: all 0.2s;
    font-size: 1rem;
  }

  .new-post-btn:hover {
    background: #444;
  }

  .loading {
    display: none;
    text-align: center;
    color: #D946EF;
    font-size: 1.2rem;
    margin: 2rem 0;
  }

  .loading.active {
    display: block;
  }

  .keywords-display {
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 1.5rem;
    margin-top: 2rem;
    color: #ccc;
    text-align: left;
  }

  .keywords-display h3 {
    color: #D946EF;
    margin-top: 0;
    font-size: 1rem;
  }

  .keyword-item {
    display: grid;
    grid-template-columns: 200px 1fr;
    gap: 1rem;
    margin-bottom: 1rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid #333;
    font-size: 0.95rem;
  }

  .keyword-item:last-child {
    border-bottom: none;
    margin-bottom: 0;
    padding-bottom: 0;
  }

  .keyword-label {
    color: #999;
    font-weight: 600;
  }

  .keyword-value {
    color: #e0e0e0;
  }

  @media (max-width: 768px) {
    .gen-header h1 {
      font-size: 2.5rem;
    }

    .gen-header p {
      font-size: 1rem;
    }

    .keyword-item {
      grid-template-columns: 1fr;
      gap: 0.5rem;
    }
  }

  /* 스크롤바 스타일 */
  .output-content::-webkit-scrollbar {
    width: 8px;
  }

  .output-content::-webkit-scrollbar-track {
    background: #1a1a1a;
  }

  .output-content::-webkit-scrollbar-thumb {
    background: #D946EF;
    border-radius: 4px;
  }

  .output-content::-webkit-scrollbar-thumb:hover {
    background: #c936de;
  }
</style>
</head>
<body>

<div class="generator-container">
  <div class="gen-header">
    <h1>홈판에 꽂히는<br><strong>원고 자판기</strong></h1>
    <p>한 번의 클릭으로 완성되는 홈판 최적화 원고<br>내가 알아서 키워드를 선택해 원고를 만들어드립니다</p>
  </div>

  <div class="button-group">
    <button class="generate-btn" onclick="generatePost()">원고 생성하기</button>
  </div>

  <div class="loading" id="loading">⏳ 원고를 만드는 중입니다...</div>

  <div class="keywords-display" id="keywordsDisplay" style="display: none;">
    <h3>📌 이 원고의 키워드</h3>
    <div id="keywordsList"></div>
  </div>

  <div class="output-section">
    <div class="output-content" id="generatedOutput"></div>
    <div class="button-actions" id="actions" style="display: none;">
      <button class="copy-btn" onclick="copyToClipboard()">📋 클립보드 복사</button>
      <button class="download-btn" onclick="downloadPost()">⬇️ 파일 다운로드</button>
      <button class="new-post-btn" onclick="resetAndGenerate()">➕ 새 원고 생성</button>
    </div>
  </div>
</div>

<script>
  /* ★★★ 글쓰기 규칙 (비공개) ★★★
  절대 최우선 규칙 체크리스트:
  ✅ 각 줄: 공백포함 15~20글자
  ✅ 각 문단: 정확히 4~5줄
  ✅ 문단 사이: 빈 줄 1줄
  ✅ 금칙어: 0개 (의료/금융/불건전 절대 금지)
  ✅ 사진 자리: 4~6개 (500~600자마다)
  ✅ 해시태그: 10개
  ✅ 검색 의도 우선 (키워드 반복 아님)
  ✅ 정보 밀도 + 문서 차별성
  ✅ Q&A 및 리스트도 위 규칙 동일 적용
  ✅ 인용구: 1, 3, 4, 6번만 사용
  ✅ 사실 기반 작성 (과장/추측 금지)
  ✅ 사람 말투 강화 (AI 문체 제거)
  ✅ E-E-A-T 강화 (전문성/권위성/신뢰성)
  ✅ 자영업자: 신뢰감 + 차별점 + 고객 정보 우선
  */

  // 홈판 최적화 키워드 데이터베이스
  const homepageKeywords = [
    {
      mainKeyword: '아침 루틴',
      coreKeyword: '30분 아침 루틴으로 하루가 바뀐다',
      subKeyword1: '아침을 깨우는 가장 간단한 방법',
      subKeyword2: '바쁜 아침에 여유를 만드는 3가지 습관',
      targetAudience: '직장인, 항상 바쁜 사람들',
      tone: 'casual',
      perspective: 'experience',
      topic: '30분 아침 루틴으로 하루를 긍정적으로 시작하는 방법',
      feeling: '아침이 두렵지 않고 오히려 기대되는 마음',
      emphasis: '완벽한 루틴이 아니라 지속 가능한 작은 습관이 중요하다'
    },
    {
      mainKeyword: '집 정리',
      coreKeyword: '버리기보다 정리의 순서가 결정한다',
      subKeyword1: '가장 먼저 정리해야 할 공간이 따로 있다',
      subKeyword2: '정리 후 물건이 자꾸 쌓이는 이유',
      targetAudience: '집이 어수선한 사람들',
      tone: 'friendly',
      perspective: 'experience',
      topic: '집 정리는 순서가 결정한다는 깨달음',
      feeling: '정리된 공간에서 평안함과 집중력 회복',
      emphasis: '물건 버리기가 아니라 공간과 생활 방식의 정렬'
    },
    {
      mainKeyword: '습관 변화',
      coreKeyword: '큰 계획보다 작은 습관이 인생을 바꾼다',
      subKeyword1: '실패하는 사람들의 공통된 실수',
      subKeyword2: '1주일 안에 습관이 자리잡는 신호들',
      targetAudience: '자기계발에 관심 있지만 실패가 많은 사람들',
      tone: 'friendly',
      perspective: 'observation',
      topic: '6개월간 작은 습관을 만들면서 배운 것들',
      feeling: '나도 충분히 변할 수 있다는 확신',
      emphasis: '유명한 방법론이 아니라 현실에서 작동하는 법칙'
    },
    {
      mainKeyword: '여행 경험',
      coreKeyword: '계획 없는 여행이 더 많은 것을 남긴다',
      subKeyword1: '여행에서 발견되는 가장 소중한 순간들',
      subKeyword2: '지역 주민처럼 여행하는 법',
      targetAudience: '여행을 좋아하지만 시간이 부족한 사람들',
      tone: 'casual',
      perspective: 'experience',
      topic: '일주일 짧은 여행이라도 의미있게 보내는 방법',
      feeling: '새로운 곳에서 자신을 발견하는 즐거움',
      emphasis: '비용보다 마음가짐의 차이가 여행의 질을 결정한다'
    },
    {
      mainKeyword: '독서 습관',
      coreKeyword: '책장이 어질러도 괜찮은 이유',
      subKeyword1: '속도보다 깊이로 읽는 법',
      subKeyword2: '책을 읽으면서 얻게 되는 예상 밖의 것들',

      feeling: '책이 삶의 가치를 바꾼다는 작은 확신',
      emphasis: '책 추천이 아니라 독서의 의미 찾기'
    },
    {
      mainKeyword: '일과 삶의 균형',
      coreKeyword: '출근 전 1시간이 하루를 결정한다',
      subKeyword1: '일하면서도 나를 잃지 않는 법',
      subKeyword2: '퇴근 후 마음이 정리되는 루틴 3가지',
      targetAudience: '일로 지친 직장인들',
      tone: 'friendly',
      perspective: 'experience',
      topic: '일 중심이 아닌 삶 중심으로 사는 법',
      feeling: '회사 일이 전부가 아니라는 깨달음',
      emphasis: '일을 잘하는 것보다 자신을 지키는 게 먼저'
    },
    {
      mainKeyword: '자기계발',
      coreKeyword: '작년의 나와 달라지는 가장 간단한 방법',
      subKeyword1: '변화를 원하는 사람이 하는 첫 번째 실수',
      subKeyword2: '3개월 후 남는 것과 사라지는 것',
      targetAudience: '성장하고 싶지만 어디서부터 시작할지 모르는 사람들',
      tone: 'casual',
      perspective: 'observation',
      topic: '꾸준함이 아니라 작은 변화의 축적이 인생을 바꾼다',
      feeling: '변화는 언제든 시작할 수 있다는 용기',
      emphasis: '거창한 목표보다 하루하루의 선택이 중요하다'
    },
    {
      mainKeyword: '일상의 즐거움',
      coreKeyword: '특별한 것을 찾으려다 놓치는 일상의 행복',
      subKeyword1: '평범해 보이는 것에서 찾는 감사',
      subKeyword2: '오늘 하루를 의미있게 만드는 작은 것들',
      targetAudience: '일상에 지친 사람들',
      tone: 'friendly',
      perspective: 'experience',
      topic: '특별할 것 없는 하루하루가 가장 소중하다는 것을 깨달은 이야기',
      feeling: '지금 이 순간이 가장 중요하다는 느낌',
      emphasis: '큰 행복을 기다리기보다 작은 것을 감사하기'
    }
  ];

  function selectRandomKeywords() {
    return homepageKeywords[Math.floor(Math.random() * homepageKeywords.length)];
  }

  function generatePost() {
    const loading = document.getElementById('loading');
    loading.classList.add('active');

    setTimeout(() => {
      const keywords = selectRandomKeywords();
      const post = createHomepageOptimizedPost(keywords);

      const output = document.getElementById('generatedOutput');
      output.innerHTML = post;
      output.classList.add('active');

      document.getElementById('actions').style.display = 'flex';
      document.getElementById('keywordsDisplay').style.display = 'block';

      // 키워드 표시
      const keywordsList = document.getElementById('keywordsList');
      keywordsList.innerHTML = `
        <div class="keyword-item">
          <div class="keyword-label">메인 키워드</div>
          <div class="keyword-value">${keywords.mainKeyword}</div>
        </div>
        <div class="keyword-item">
          <div class="keyword-label">핵심 가치</div>
          <div class="keyword-value">${keywords.coreKeyword}</div>
        </div>
        <div class="keyword-item">
          <div class="keyword-label">타겟 독자</div>
          <div class="keyword-value">${keywords.targetAudience}</div>
        </div>
        <div class="keyword-item">
          <div class="keyword-label">관점</div>
          <div class="keyword-value">${keywords.perspective === 'experience' ? '경험 기반' : keywords.perspective === 'observation' ? '관찰 기반' : '정보 기반'}</div>
        </div>
      `;

      loading.classList.remove('active');
      window.scrollTo({ top: document.querySelector('.output-content').offsetTop - 100, behavior: 'smooth' });
    }, 1000);
  }

  function createHomepageOptimizedPost(keywords) {
    const title = generateTitle(keywords);
    const introduction = generateIntroduction(keywords);
    const section1 = generateSection1(keywords);
    const section2 = generateSection2(keywords);
    const conclusion = generateConclusion(keywords);

    return `
      <h1>${title}</h1>

      <h2>시작하며</h2>
      <p>${introduction}</p>

      <h2>${keywords.subKeyword1}</h2>
      <p>${section1}</p>

      <h2>${keywords.subKeyword2}</h2>
      <p>${section2}</p>

      ${keywords.emphasis ? `
      <h2>꼭 기억하세요</h2>
      <p><strong>${keywords.emphasis}</strong></p>
      ` : ''}

      <h2>마치며</h2>
      <p>${conclusion}</p>
    `;
  }

  function generateTitle(kw) {
    const templates = [
      `"${kw.coreKeyword}"… 알고 보니 이런 비법이?`,
      `${kw.mainKeyword}에서 가장 중요한 것, 당신은 알아요?`,
      `${kw.mainKeyword}, 이것만 꼭 기억하세요`,
      `${kw.mainKeyword}를 제대로 하는 사람들의 공통점`,
      `저도 처음에 몰랐던 ${kw.mainKeyword}의 진짜 의미`
    ];
    return templates[Math.floor(Math.random() * templates.length)];
  }

  function generateIntroduction(kw) {
    const perspectives = {
      experience: `${kw.mainKeyword}에 대해 알고 계세요? 저는 직접 경험하면서 깨닫게 된 것들이 많습니다. 처음엔 "${kw.coreKeyword}"라는 것을 전혀 몰랐는데, 이제는 이게 가장 중요하다고 생각해요. 오늘은 제가 배운 것들을 ${kw.targetAudience}분들과 나누고 싶습니다.`,
      observation: `요즘 많은 분들이 ${kw.mainKeyword}를 놓치고 있어요. 저도 수많은 분들을 보면서 느낀 건데, "${kw.coreKeyword}"에 집중하는 사람과 그렇지 않은 사람의 차이가 정말 크더라고요. 그 차이가 뭘까요? 오늘 그 비밀을 풀어보겠습니다.`,
      information: `${kw.mainKeyword}에 관한 정보가 많지만, 정말 필요한 것은 따로 있어요. 바로 "${kw.coreKeyword}"입니다. 이 핵심에 집중하면 ${kw.mainKeyword}의 70%는 성공한 거예요. 지금부터 그 방법을 알려드릴게요.`
    };
    return perspectives[kw.perspective];
  }

  function generateSection1(kw) {
    const templates = {
      experience: `제가 처음 ${kw.mainKeyword}를 했을 때는 정말 몰랐어요. ${kw.subKeyword1}이 이렇게 중요할 줄은요. 그런데 시간이 지나면서 깨달았습니다. 이게 얼마나 큰 차이를 만드는지 말이에요. ${kw.targetAudience}분들도 이 부분에 집중하면 지금과는 완전히 다른 결과를 얻을 거예요. 가장 중요한 건 "왜"를 이해하는 것입니다.`,
      observation: `많은 사람들이 놓치는 부분이 바로 ${kw.subKeyword1}입니다. 저는 여러 분들을 관찰하면서 성공하는 사람들의 공통점을 찾았거든요. 그들은 모두 이 부분에 집중했어요. 당신도 이제 알 수 있습니다. 이것만 기억하면, 나머지는 자연스럽게 따라올 거예요.`,
      information: `${kw.subKeyword1}의 핵심은 이렇습니다. 많은 자료들이 복잡하게 설명하지만, 정리하면 아주 간단해요. 이 한 가지만 잘 이해하면, ${kw.mainKeyword}는 완전히 달라져요.`
    };
    return templates[kw.perspective];
  }

  function generateSection2(kw) {
    const templates = {
      experience: `그 다음이 ${kw.subKeyword2}인데요. 저도 처음엔 이걸 간과했어요. 하지만 이게 있고 없고의 차이가 정말 크더라고요. 특히 ${kw.targetAudience}분들이 자주 실수하는 부분이 바로 여기예요. 이 부분을 제대로 하려면 먼저 마음가짐을 바꿔야 합니다.`,
      observation: `그리고 ${kw.subKeyword2}는 정말 중요해요. 성공하는 사람들을 보면 이 부분이 확실하더라고요. 당신 주변에서도 잘되는 사람들을 찾아보세요. 그들이 뭘 하고 있는지 보면 답이 나올 거예요.`,
      information: `${kw.subKeyword2}도 꼭 알아야 할 내용입니다. 이를 통해 당신은 더 나은 선택을 할 수 있게 될 거예요.`
    };
    return templates[kw.perspective];
  }

  function generateConclusion(kw) {
    const templates = {
      experience: `제가 이 글을 쓰는 이유는 ${kw.feeling}을 당신도 느꼈으면 해서예요. ${kw.mainKeyword}는 결코 어렵지 않습니다. 다만 정확한 방향으로 가야 할 뿐이에요. 당신도 할 수 있습니다. 오늘 배운 것들을 차근차근 실천해보세요. 분명 좋은 결과가 따라올 거예요.`,
      observation: `${kw.mainKeyword}를 잘하는 사람이 되기 위해서는 이 점들이 정말 중요해요. 당신도 이제 이것들을 알았으니, 할 수 있습니다. 주변에서 잘되는 사람들을 더 자세히 관찰해보세요. 더 많은 배움이 있을 거예요.`,
      information: `${kw.mainKeyword}에 대한 정보는 많지만, 이렇게 정리된 내용은 드물어요. 이 글이 당신의 ${kw.mainKeyword} 여정에 도움이 되길 바랍니다. 다음에는 더 심화된 내용으로 찾아뵐게요!`
    };
    return templates[kw.perspective];
  }

  function copyToClipboard() {
    const text = document.getElementById('generatedOutput').innerText;
    navigator.clipboard.writeText(text).then(() => {
      const btn = document.querySelector('.copy-btn');
      const original = btn.innerText;
      btn.innerText = '✓ 복사됨!';
      setTimeout(() => { btn.innerText = original; }, 2000);
    });
  }

  function downloadPost() {
    const text = document.getElementById('generatedOutput').innerText;
    const element = document.createElement('a');
    element.setAttribute('href', 'data:text/plain;charset=utf-8,' + encodeURIComponent(text));
    element.setAttribute('download', `홈판원고_${new Date().toISOString().split('T')[0]}.txt`);
    element.style.display = 'none';
    document.body.appendChild(element);
    element.click();
    document.body.removeChild(element);
  }

  function resetAndGenerate() {
    document.getElementById('generatedOutput').classList.remove('active');
    document.getElementById('actions').style.display = 'none';
    document.getElementById('keywordsDisplay').style.display = 'none';
    setTimeout(() => generatePost(), 300);
  }
</script>
</body>
</html>
