    loadingDot.classList.remove('hidden');

    setTimeout(() => {
      const keyword = homepageKeywords.find(k => k.id === theme);

      // 협찬 표기 (공정위 규정)
      let sponsorNotice = '';
      if (sponsorType !== 'none') {
        const notices = {
          experience: '[유의: 이 글은 무료 체험 서비스를 통해 작성되었습니다.]',
          product: '[유의: 이 글은 협찬 제품을 포함하고 있습니다.]',
          service: '[유의: 이 글은 협찬 서비스를 이용하여 작성되었습니다.]'
        };
        sponsorNotice = `\n${notices[sponsorType] || ''}\n\n`;
      }

      // 제목 선택
      const titles = generateTitles(keyword.mainKeyword, keyword.subKeyword1);
      const title = titles[Math.floor(Math.random() * titles.length)];

      // Yes-Set 도입부
      const intro = generateYesSet(keyword.mainKeyword, targetInfo, keyword.drawback);

      // 본문
      const content = generateMainContent(keyword.mainKeyword, keyword.expertise, keyword.drawback);

      // 결론
      const conclusion = generateConclusion(keyword.mainKeyword, targetInfo);

      // 해시태그
      const hashtags = generateHashtags(keyword);

      // 최종 원고
      const finalPost = `${sponsorNotice}${title}

${intro}

---

${content}

---

${conclusion}

${hashtags}`;

      const output = document.getElementById('outputContent');
      output.innerHTML = `
        <div class="post-title">${title}</div>
        <div class="post-content">${finalPost}</div>
        ${generateSEOChecklist(title, keyword)}
        <div class="keyword-info">
          <strong>📊 키워드 정보</strong><br>
          메인: ${keyword.mainKeyword} | 세부: ${keyword.subKeyword1}, ${keyword.subKeyword2}<br>
          톤: ${keyword.tone} | 관점: ${keyword.perspective} | 전문성: ${keyword.expertise}
        </div>
        <button class="copy-btn" onclick="copyToClipboard()">📋 복사하기</button>
        <button class="download-btn" onclick="downloadPost('${title.replace(/[^a-z0-9]/gi, '_').toLowerCase()}')">💾 다운로드</button>
      `;

      loadingDot.classList.add('hidden');
      window.lastPost = finalPost;
    }, 800);
  }

  function copyToClipboard() {
    if (window.lastPost) {
      navigator.clipboard.writeText(window.lastPost).then(() => {
        alert('원고가 복사되었습니다.');
      });
    }
  }

  function downloadPost(filename) {
    if (window.lastPost) {
      const element = document.createElement('a');
      element.setAttribute('href', 'data:text/plain;charset=utf-8,' + encodeURIComponent(window.lastPost));
      element.setAttribute('download', `${filename}.txt`);
      element.style.display = 'none';
      document.body.appendChild(element);
      element.click();
      document.body.removeChild(element);
    }
  }

  function resetForm() {
    document.getElementById('themeSelect').value = '';
    document.getElementById('targetInfo').value = '';
    document.getElementById('sponsorType').value = 'none';
    document.getElementById('outputContent').innerHTML =
      '<p style="color: #666; text-align: center; padding: 2rem;">위에서 주제를 선택하고 "원고 생성" 버튼을 누르면 완성된 글이 여기에 나타납니다.</p>';
    window.lastPost = null;
  }
</script>
